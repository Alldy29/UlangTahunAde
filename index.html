<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Untukmu — Happy Birthday</title>

    <link rel="stylesheet" href="css/style.css?v=8">
</head>

<body>

    <!-- =====================================================
         BACKGROUND PARTICLES
    ====================================================== -->
    <div id="particles"></div>


    <!-- =====================================================
         TRANSITION OVERLAY
    ====================================================== -->
    <div id="transition-overlay"></div>


    <!-- =====================================================
         SECTION 1 — KADO
    ====================================================== -->
    <section id="gift-section" class="section active">

        <div class="gift-bg-glow"></div>

        <div class="stars">
            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
            <span>♡</span>
            <span>✧</span>
            <span>·</span>
        </div>


        <div class="gift-container">

            <div class="title-wrapper">

                <p class="small-title">
                    Something special for you
                </p>

                <h1 class="gift-text">
                    Gift For You
                </h1>

                <div class="title-line"></div>

            </div>


            <!-- KADO -->
            <div class="gift-wrapper">

                <div class="gift-shadow"></div>

                <div
                    class="gift-box"
                    id="gift-box"
                    tabindex="0"
                    onclick="openGift()"
                >

                    <svg
                        viewBox="0 0 200 200"
                        class="gift-svg"
                    >

                        <defs>

                            <!-- BOX -->
                            <linearGradient
                                id="boxGrad"
                                x1="0%"
                                y1="0%"
                                x2="100%"
                                y2="100%"
                            >
                                <stop
                                    offset="0%"
                                    stop-color="#ff758c"
                                />

                                <stop
                                    offset="100%"
                                    stop-color="#ff9a9e"
                                />
                            </linearGradient>


                            <!-- RIBBON -->
                            <linearGradient
                                id="ribbonGrad"
                                x1="0%"
                                y1="0%"
                                x2="100%"
                                y2="100%"
                            >
                                <stop
                                    offset="0%"
                                    stop-color="#FFE066"
                                />

                                <stop
                                    offset="50%"
                                    stop-color="#F5B700"
                                />

                                <stop
                                    offset="100%"
                                    stop-color="#D99B00"
                                />
                            </linearGradient>


                            <!-- SHADOW -->
                            <filter
                                id="lidShadow"
                                x="-20%"
                                y="-20%"
                                width="140%"
                                height="140%"
                            >
                                <feDropShadow
                                    dx="0"
                                    dy="5"
                                    stdDeviation="3"
                                    flood-opacity="0.2"
                                />
                            </filter>


                            <!-- LIGHT -->
                            <filter
                                id="lightGlow"
                                x="-100%"
                                y="-100%"
                                width="300%"
                                height="300%"
                            >
                                <feGaussianBlur
                                    stdDeviation="8"
                                />
                            </filter>

                        </defs>


                        <!-- =================================================
                             BOX BODY
                        ================================================== -->

                        <g id="gift-base">

                            <rect
                                x="35"
                                y="90"
                                width="130"
                                height="90"
                                rx="8"
                                fill="url(#boxGrad)"
                            />

                            <!-- Horizontal Ribbon -->
                            <rect
                                x="35"
                                y="130"
                                width="130"
                                height="18"
                                fill="url(#ribbonGrad)"
                            />

                            <!-- Vertical Ribbon -->
                            <rect
                                x="91"
                                y="90"
                                width="18"
                                height="90"
                                fill="url(#ribbonGrad)"
                            />

                        </g>


                        <!-- =================================================
                             CAHAYA DARI DALAM KADO
                        ================================================== -->

                        <circle
                            id="gift-light"
                            cx="100"
                            cy="120"
                            r="18"
                            fill="#fff"
                            opacity="0"
                            filter="url(#lightGlow)"
                        />


                        <!-- =================================================
                             GIFT LID
                        ================================================== -->

                        <g
                            id="gift-lid"
                            filter="url(#lidShadow)"
                        >

                            <!-- Lid -->
                            <rect
                                x="30"
                                y="70"
                                width="140"
                                height="25"
                                rx="5"
                                fill="url(#boxGrad)"
                            />

                            <!-- Lid Ribbon -->
                            <rect
                                x="91"
                                y="70"
                                width="18"
                                height="25"
                                fill="url(#ribbonGrad)"
                            />


                            <!-- Left Bow -->
                            <path
                                d="M 100 72
                                   C 55 15, 25 50, 95 75"
                                fill="none"
                                stroke="url(#ribbonGrad)"
                                stroke-width="14"
                                stroke-linecap="round"
                            />


                            <!-- Right Bow -->
                            <path
                                d="M 100 72
                                   C 145 15, 175 50, 105 75"
                                fill="none"
                                stroke="url(#ribbonGrad)"
                                stroke-width="14"
                                stroke-linecap="round"
                            />


                            <!-- Knot -->
                            <circle
                                cx="100"
                                cy="72"
                                r="10"
                                fill="url(#ribbonGrad)"
                            />

                        </g>

                    </svg>

                </div>

            </div>


            <!-- INSTRUCTION -->
            <div class="instruction-wrapper">

                <p class="instruction-main">
                    Ada sesuatu untukmu...
                </p>

                <p class="instruction">
                    Klik kadonya untuk membuka 💗
                </p>

            </div>

        </div>

    </section>



    <!-- =====================================================
         SECTION 2 — BUSUR & HATI
    ====================================================== -->

    <section
        id="archery-section"
        class="section archery-section"
    >

        <div class="archery-bg-glow"></div>


        <!-- HEADER -->

        <div class="archery-header">

            <p class="small-title">
                One little thing...
            </p>

            <h2>
                Temukan hatinya ❤️
            </h2>

            <div class="title-line"></div>

        </div>


        <!-- HATI -->

        <div
            class="heart-container"
            id="heart-container"
        >

            <div
                class="heart-glow"
                id="heart-glow"
            ></div>

            <div
                class="heart"
                id="target-heart"
            ></div>

            <div class="heart-sparkles">
                <span>✦</span>
                <span>✧</span>
                <span>✦</span>
            </div>

        </div>


        <!-- INSTRUCTION -->

        <div class="archery-instruction">

            <p>
                Tarik anak panahnya ke kiri-bawah,
                lalu lepaskan ke arah hati.
            </p>

            <span>
                💗
            </span>

        </div>


        <!-- BUSUR -->

        <div
            class="bow-container"
            id="bow-container"
        >

            <svg
                class="bow-svg"
                viewBox="0 0 200 300"
            >

                <!-- Busur -->

                <path
                    d="M 20,20
                       Q 180,150 20,280"
                    fill="none"
                    stroke="#c58d62"
                    stroke-width="8"
                    stroke-linecap="round"
                />


                <!-- Tali -->

                <path
                    id="bow-string"
                    d="M 20,20 L 20,280"
                    fill="none"
                    stroke="#fffaf0"
                    stroke-width="2"
                />


                <!-- Anak Panah -->

                <g
                    id="arrow"
                    class="arrow"
                >
                    <!-- Wrapper getaran untuk efek saat menancap -->
                    <g id="arrow-vibration">

                        <!-- Area sentuh tak kasat mata agar mudah ditekan -->
                        <rect x="-20" y="110" width="220" height="80" fill="white" fill-opacity="0" pointer-events="all" />

                        <line
                            x1="20"
                            y1="150"
                            x2="160"
                            y2="150"
                            stroke="#936b4f"
                            stroke-width="4"
                        />


                        <!-- Kepala panah -->

                        <polygon
                            points="160,145 160,155 180,150"
                            fill="#60483d"
                        />


                        <!-- Bulu -->

                        <line
                            x1="20"
                            y1="150"
                            x2="10"
                            y2="140"
                            stroke="#fffaf0"
                            stroke-width="3"
                        />

                        <line
                            x1="20"
                            y1="150"
                            x2="10"
                            y2="160"
                            stroke="#fffaf0"
                            stroke-width="3"
                        />

                    </g>
                </g>

            </svg>

        </div>


        <!-- SUCCESS -->

        <div
            id="archery-success"
            class="archery-success"
        >

            <div class="success-burst">
                ❤️
            </div>

            <h2>
                Kamu menemukannya.
            </h2>

            <p>
                Sekarang ada sesuatu yang ingin aku sampaikan...
            </p>

        </div>

    </section>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/script.js?v=7"></script>

    <!-- Background Music -->
    <audio id="bgm" src="assets/a_thousand_years.mp3" loop></audio>
    <script>
        const bgm = document.getElementById('bgm');
        const savedTime = sessionStorage.getItem('bgmTime');
        if (savedTime) {
            bgm.currentTime = parseFloat(savedTime);
            bgm.play().catch(() => {});
        }
        
        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('bgmTime', bgm.currentTime);
        });

        // Start music on first interaction
        document.body.addEventListener('click', () => {
            if (bgm.paused) {
                bgm.play().catch(() => {});
            }
        });
    </script>

</body>
</html>
