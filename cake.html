<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #fff8f9 0%, #ffe8ed 55%, #ffd8e1 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .canvas-container {
            position: relative;
            max-width: 900px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            background-color: transparent;
        }
        .btn-lanjut {
            display: inline-flex;
            align-items: center;
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #713f4b;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: absolute;
            bottom: 60px;
            z-index: 10;
            opacity: 0.8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .btn-lanjut:hover {
            opacity: 1;
        }
        .btn-lanjut .arrow {
            margin-left: 10px;
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        .btn-lanjut:hover .arrow {
            transform: translateX(6px);
        }

        /* Bintang / Efek Background */
        .stars span {
            position: absolute;
            color: #ff8fa3; 
            font-size: 24px;
            animation: twinkle 2s ease-in-out infinite;
            z-index: 1;
        }
        .stars span:nth-child(1) { top: 15%; left: 15%; animation-delay: 0s; }
        .stars span:nth-child(2) { top: 25%; right: 20%; animation-delay: 0.4s; }
        .stars span:nth-child(3) { top: 45%; left: 8%; animation-delay: 0.8s; }
        .stars span:nth-child(4) { bottom: 25%; left: 18%; animation-delay: 1.2s; }
        .stars span:nth-child(5) { bottom: 30%; right: 12%; animation-delay: 0.6s; }
        .stars span:nth-child(6) { top: 18%; right: 40%; animation-delay: 1.5s; }
        .stars span:nth-child(7) { top: 60%; right: 8%; animation-delay: 0.2s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.4); }
        }
    </style>
</head>
<body>
    
    <!-- Efek Bintang -->
    <div class="stars">
        <span>✦</span><span>✧</span><span>✦</span><span>♡</span><span>✧</span><span>✦</span><span>♡</span>
    </div>

    <div class="canvas-container">
        <!-- Canvas tempat kue ulang tahun akan digambar -->
        <canvas id="cakeCanvas" width="900" height="800"></canvas>
    </div>
    
    <!-- Tombol menuju halaman index.html -->
    <a href="index.html" class="btn-lanjut">Next <span class="arrow">&rarr;</span></a>

    <script src="js/cake.js"></script>

    <!-- Background Music -->
    <audio id="bgm" src="assets/a_thousand_years.mp3" loop></audio>
    <script>
        const bgm = document.getElementById('bgm');
        const savedTime = sessionStorage.getItem('bgmTime');
        if (savedTime) {
            bgm.currentTime = parseFloat(savedTime);
            bgm.play().catch(() => {});
        }
        
        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('bgmTime', bgm.currentTime);
        });

        // Start music on first interaction
        document.body.addEventListener('click', () => {
            if (bgm.paused) {
                bgm.play().catch(() => {});
            }
        });
    </script>

</body>
</html>
